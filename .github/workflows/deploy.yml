name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # ── Build frontend assets on GitHub runner (bukan di VPS) ──────────────
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --prefer-offline

      - name: Build Frontend Assets
        run: npm run build

      # ── Upload built assets ke VPS via SCP ────────────────────────────────
      - name: Upload Built Assets to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "public/build"
          target: "/var/www/siakad.almahirsoft.com/almahir"
          overwrite: true

      # ── Deploy ke VPS via SSH (tanpa npm) ────────────────────────────────
      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/siakad.almahirsoft.com/almahir

            # 1. Ambil perubahan terbaru dari GitHub
            git pull origin main

            # 2. Install/Update dependensi PHP (Composer)
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # 3. Jalankan migrasi database
            php artisan migrate --force

            # 4. Bersihkan dan rebuild cache Laravel
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 5. Restart queue worker jika ada
            # php artisan queue:restart
